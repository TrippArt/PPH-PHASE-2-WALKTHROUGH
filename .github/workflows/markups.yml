name: Add markups from an issue

# The walkthrough's "Save for the team" button opens an issue titled "[markup] ..." with the strokes as JSON.
# This adds them to markups.json on main (tools/add_markup.py), replies on the issue and closes it.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: markups
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, '[markup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Merge the strokes into markups.json
        env:
          BODY: ${{ github.event.issue.body }}
          USER: ${{ github.event.issue.user.login }}
          NUM: ${{ github.event.issue.number }}
        run: python3 tools/add_markup.py
      - name: Commit and push
        run: |
          git config user.name "pph-markup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markups.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Markups from issue #${{ github.event.issue.number }} by ${{ github.event.issue.user.login }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push itself usually triggers it"
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file .markup_reply.txt
          gh issue close "$NUM" --repo "${{ github.repository }}"
